<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Loading App</title>

    <!-- MONETAG IN-PAGE PUSH AD SCRIPT -->
    <script>(function(s){s.dataset.zone='11719353',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0;
        }
        .btn {
            background-color: #94a3b8;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: not-allowed;
            width: 100%;
            transition: 0.3s;
        }
        .btn.active {
            background-color: #0284c7;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>ShareMap Digital Address</h2>
        <p>Inihahanda ang iyong app, pakihintay...</p>

        <div class="timer" id="countdown">5</div>

        <button id="proceedBtn" class="btn" disabled>Loading...</button>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const btn = document.getElementById('proceedBtn');

        const mainAppUrl = "./index.html";
        
        // DIRECT LINK MULA SA MONETAG DASHBOARD MO
        const directLinkUrl = "https://omg10.com/4/11719626"; 

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.style.display = "none";
                btn.classList.add("active");
                btn.removeAttribute("disabled");
                btn.textContent = "Open ShareMap App";

                btn.onclick = () => {
                    // 1. PINAPASOK ANG CLEARANCE TOKEN (Para hindi ire-redirect sa ShrinkEarn)
                    sessionStorage.setItem('passedGateway', 'true');

                    // 2. Magbubukas ang High-paying Direct Link Ad sa bagong tab
                    window.open(directLinkUrl, '_blank');
                    
                    // 3. Lilipat ang user sa mismong main app sa kasalukuyang tab
                    window.location.href = mainAppUrl;
                };
            }
        }, 9000);
    </script>

</body>
</html>
