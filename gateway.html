<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareMap - Loading App</title>

    <!-- MONETAG IN-PAGE PUSH AD SCRIPT -->
    <script>(function(s){s.dataset.zone='11719353',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 15px 0;
        }
        .btn {
            background-color: #94a3b8;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: not-allowed;
            width: 100%;
            transition: 0.3s;
        }
        .btn.active {
            background-color: #0284c7;
            cursor: pointer;
        }
        .messenger-alert {
            display: none;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Messenger Warning Alert -->
        <div id="messengerNotice" class="messenger-alert">
            ⚠️ <b>Gamit mo ang Messenger Browser:</b><br>
            Pindutin ang button sa ibaba at i-tap ang <b>"CONTINUE"</b> para magbukas sa Chrome browser.
        </div>

        <h2>ShareMap Digital Address</h2>
        <p id="subText">Inihahanda ang iyong app, pakihintay...</p>

        <div class="timer" id="countdown">5</div>

        <button id="proceedBtn" class="btn" disabled>Loading...</button>
    </div>

    <script>
        const mainAppUrl = "./index.html";
        const directLinkUrl = "https://omg10.com/4/11719626"; 

        // 1. Function para malaman kung nasa loob ng Messenger In-App Browser
        function isMessengerBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            return (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Messenger") > -1);
        }

        const countdownEl = document.getElementById('countdown');
        const btn = document.getElementById('proceedBtn');
        const noticeEl = document.getElementById('messengerNotice');
        const subTextEl = document.getElementById('subText');

        // 2. SURIIN MUNA KUNG NASA MESSENGER
        if (isMessengerBrowser()) {
            // Kung nasa Messenger, ISARA MUNA ANG TIMER at hingin na lumipat sa Chrome
            countdownEl.style.display = "none";
            noticeEl.style.display = "block";
            subTextEl.innerText = "Kailangan buksan sa Chrome para sa tamang GPS location.";

            btn.classList.add("active");
            btn.removeAttribute("disabled");
            btn.textContent = "🌐 Lipat at Buksan sa Chrome";

            btn.onclick = () => {
                const currentUrl = window.location.href;
                const cleanUrl = currentUrl.replace(/^https?:\/\//, '');
                // Lilipat sa Chrome Browser habang nananatili sa gateway.html
                window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
            };
        } else {
            // 3. KUNG TOTOONG BROWSER NA (CHROME / SAFARI / ETC.), PATAKBUHIN ANG TIMER AT ADS
            let timeLeft = 5;

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.style.display = "none";
                    btn.classList.add("active");
                    btn.removeAttribute("disabled");
                    btn.textContent = "Open ShareMap App";

                    btn.onclick = () => {
                        // Mag-iwan ng clearance token sa Chrome session
                        sessionStorage.setItem('passedGateway', 'true');

                        // Magbukas ng Monetag ad
                        window.open(directLinkUrl, '_blank');
                        
                        // Pumunta sa main index.html
                        window.location.href = mainAppUrl;
                    };
                }
            }, 1000);
        }
    </script>

</body>
</html>
