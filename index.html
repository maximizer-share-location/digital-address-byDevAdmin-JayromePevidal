<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Delivery Location Share</title>

  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      text-align: center;
      background-color: #f4f7f6;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 20px auto;
    }
    .share-btn { 
      background-color: #0084FF; 
      color: white; 
      padding: 16px 24px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    .share-btn:active {
      background-color: #006bce;
    }
    .status-msg {
      font-size: 13px;
      color: #0084FF;
      margin-top: 10px;
      font-weight: bold;
    }
    .copyright-footer {
      margin-top: 30px;
      font-size: 12px;
      color: #777777;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>📍 Delivery Location Share</h3>
    <p>Pindutin ang button sa ibaba para ma-share agad ang inyong eksaktong Plus Code sa aming Messenger.</p>

    <button class="share-btn" onclick="shareLocation()">
      📤 Pindutin para I-share sa Messenger
    </button>
    <p id="status" class="status-msg"></p>
  </div>

  <script>
    const ALPHABET = "23456789CFGHJMPQRVWX";

    // Fast Native Pure JS Plus Code Encoder (No External Library)
    function encodeStandardPlusCode(lat, lng) {
      lat = Math.min(Math.max(lat, -90), 90);
      lng = ((lng + 180) % 360 + 360) % 360 - 180;
      if (lat === 90) lat = 89.999999;

      let latVal = lat + 90;
      let lngVal = lng + 180;
      let code = "";

      let latPlace = 20;
      let lngPlace = 20;

      for (let i = 0; i < 4; i++) {
        let d1 = Math.floor(latVal / latPlace);
        let d2 = Math.floor(lngVal / lngPlace);
        latVal -= d1 * latPlace;
        lngVal -= d2 * lngPlace;
        code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);
        
        latPlace /= 20;
        lngPlace /= 20;
      }

      code += "+";

      let d1 = Math.floor(latVal / latPlace);
      let d2 = Math.floor(lngVal / lngPlace);
      code += ALPHABET.charAt(d1) + ALPHABET.charAt(d2);

      return code;
    }

    function shareLocation() {
      const statusEl = document.getElementById("status");

      if (!navigator.geolocation) {
        alert("Hindi suportado ng browser mo ang Geolocation.");
        return;
      }

      statusEl.innerText = "Kina-calculate ang Plus Code...";

      // Optimized Geolocation Config para WALANG DELAY/LOADING
      const geoOptions = {
        enableHighAccuracy: true,
        timeout: 5000,
        maximumAge: 10000 // Tumatanggap ng fresh location within last 10s para instant
      };

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          // Instant Native Encoder Call
          const plusCode = encodeStandardPlusCode(lat, lng);
          const plusCodeUrl = `https://plus.codes/${plusCode}`;
          const shareText = `Plus Code: ${plusCode}\nIto po ang aking eksaktong lokasyon para sa delivery:`;

          statusEl.innerText = "";

          if (navigator.share) {
            navigator.share({
              title: 'Aking Lokasyon',
              text: shareText,
              url: plusCodeUrl
            })
            .then(() => console.log('Na-share na!'))
            .catch((err) => console.log('Canceled:', err));
          } else {
            navigator.clipboard.writeText(`${shareText}\n${plusCodeUrl}`);
            alert(`Na-copy na ang Plus Code (${plusCode})! Pwede mo na itong i-paste sa Messenger.`);
          }
        },
        (err) => {
          statusEl.innerText = "";
          alert("Siguraduhing naka-ON ang GPS/Location sa iyong phone.");
        },
        geoOptions
      );
    }
  </script>

  <!-- Copyright Section -->
  <footer class="copyright-footer">
    <p>© 2026 Maximizer Admin - Developed by Jayrome Pevidal. All rights reserved.</p>
  </footer>

</body>
</html>
