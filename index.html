<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Location Share</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      text-align: center;
      background-color: #f4f7f6;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    .share-btn { 
      background-color: #0084FF; 
      color: white; 
      padding: 14px 24px; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    .share-btn:active {
      background-color: #006bce;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>📍 Delivery Location Share</h3>
    <p>Pindutin ang button sa ibaba para ma-share ang inyong eksaktong lokasyon via Messenger.</p>

    <button class="share-btn" onclick="shareLocation()">
      📤 Pindutin para I-share sa Messenger
    </button>
  </div>

  <script>
    function shareLocation() {
      // Direct Search API link para sa kasalukuyang GPS location ng device
      const myLocationUrl = "https://www.google.com/maps/search/?api=1&query=My+Location";

      // Trigger sa Web Share API para sa Android Native Share Sheet
      if (navigator.share) {
        navigator.share({
          title: 'Aking Lokasyon',
          text: 'Ito po ang aking lokasyon para sa delivery calculation:',
          url: myLocationUrl
        })
        .then(() => console.log('Matagumpay na na-share!'))
        .catch((err) => console.log('Canceled / Error:', err));
      } else {
        // Fallback para sa mga browser na walang Web Share API
        navigator.clipboard.writeText(myLocationUrl);
        alert("Nai-copy na ang link! Pwede mo na itong i-paste sa Messenger chat.");
      }
    }
  </script>

</body>
</html>
